name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: JavaScript-Syntax prüfen
        run: |
          node --check app.js
          node --check sw.js
          node --check scripts/generate-seo.mjs
          node --check scripts/indexnow-ping.mjs
          node --check assets/sync-crypto.js
          node --check assets/sync-qr.js
          node --check assets/vendor/qrcodegen.js

      # Bewusst Verzeichnis statt Einzelaufzählung: die Aufzählung ist eine Falle, weil eine neue
      # Testdatei ohne zugehörige CI-Zeile stillschweigend nie läuft. Genau so waren im
      # Backend-Repo sechs Suiten nie gefahren worden, darunter die Regressionstests zweier
      # Security-Fixes. Wer eine Testdatei unter test/ anlegt, ist hier automatisch abgedeckt.
      #
      # `node --test` OHNE Pfadargument (Auto-Discovery) statt eines Glob-Musters: der
      # Fremd-JS-Wächter (.github/scripts/check-no-foreign-js.js) verlangt, dass JEDER im Repo
      # erwähnte Skript-Dateiname auch als Datei existiert — ein Muster mit Sternchen wäre für
      # ihn ein nicht existierender Name und würde die CI rot machen. Die argumentlose Form nennt
      # keinen und findet Testdateien auch außerhalb von test/.
      #
      # Die Testdateien nutzen kein node:test, sondern melden Fehler per Exit-Code — `node --test`
      # wertet genau den aus und berichtet weiterhin pro Datei.
      - name: Testsuiten prüfen
        run: node --test

      - name: Asset- und Manifest-Integrität prüfen
        run: node .github/scripts/check-integrity.js

      - name: Keine Interna im öffentlichen Repo
        run: node .github/scripts/check-no-internals.js

      - name: Erwähnte JS-Dateinamen existieren im Repo
        run: node .github/scripts/check-no-foreign-js.js

      - name: SEO-Output ist aktuell (kein Drift zum Katalog)
        run: |
          node scripts/generate-seo.mjs
          if ! git diff --quiet -- einstellungstest sitemap.xml; then
            echo "Generiertes SEO-Output weicht vom committeten Stand ab."
            echo "Bitte 'node scripts/generate-seo.mjs' lokal laufen lassen und committen."
            git --no-pager diff --stat -- einstellungstest sitemap.xml
            exit 1
          fi
